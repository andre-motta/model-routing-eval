# Codex profile: same tasks, hooks and judges, Codex CLI as the agent.
# Run: /eval-run --config eval-codex.yaml --model gpt-6-luna --effort xhigh
extends: ./eval.yaml
runner:
  type: codex
  effort: medium
models:
  skill: gpt-6-luna
matrix:
  factors:
    model: !replace
      - gpt-6-luna
      - gpt-6.1-sol
    effort: !replace
      - low
      - xhigh
judges:
  # A runner:/ judge inside a Codex profile would try to run the Claude judge through Codex. Skip it
  # during the run; ./rescore.sh re-judges every run with eval.yaml (claude-code runner).
  - name: solution_quality
    if: "False"
