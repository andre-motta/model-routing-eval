<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Asset Endpoints — Multimodal Support</title>
    <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@6/patternfly.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@6/patternfly-addons.min.css" />
    <link rel="stylesheet" href="../assets/app.css" />
  </head>
  <body class="pf-m-redhat-font" data-page="ai-assets">
    <div class="pf-v6-c-page uxd-page">
      <header class="pf-v6-c-masthead" id="masthead">
        <div class="pf-v6-c-masthead__main">
          <a class="pf-v6-c-brand uxd-brand" href="../">Gen AI Studio</a>
        </div>
        <nav class="pf-v6-c-nav uxd-top-nav" aria-label="Primary">
          <a class="pf-v6-c-nav__link" href="../playground/" data-ouia-component-id="nav-playground">Playground</a>
          <a class="pf-v6-c-nav__link pf-m-current" href="./" data-ouia-component-id="nav-ai-assets">AI Asset Endpoints</a>
        </nav>
      </header>
      <main class="pf-v6-c-page__main">
        <section class="pf-v6-c-page__main-section pf-m-light uxd-page-header">
          <div>
            <h1>AI Asset Endpoints</h1>
            <p>Register model endpoints and expose ASR-capable assets to the Playground.</p>
          </div>
          <button class="pf-v6-c-button pf-m-primary" type="button" data-ouia-component-id="register-ai-asset">Register AI Asset</button>
        </section>
        <section class="pf-v6-c-page__main-section">
          <article class="pf-v6-c-card pf-m-rounded">
            <div class="pf-v6-c-card__title">Endpoints</div>
            <div class="pf-v6-c-card__body uxd-alert-slot" id="alert-slot"></div>
            <div class="pf-v6-c-card__body" id="asset-content"></div>
          </article>
        </section>
      </main>
    </div>
    <dialog class="pf-v6-c-modal-box uxd-modal" id="register-dialog" role="dialog" aria-modal="true" aria-labelledby="register-title">
      <header class="pf-v6-c-modal-box__header">
        <h2 class="pf-v6-c-modal-box__title" id="register-title">Register AI Asset</h2>
      </header>
      <div class="pf-v6-c-modal-box__body">
        <div class="pf-v6-c-form">
          <div class="pf-v6-c-form__group">
            <label class="pf-v6-c-form__label" for="asset-name-input">Endpoint name</label>
            <input class="pf-v6-c-form-control" id="asset-name-input" data-ouia-component-id="asset-name-input" value="Whisper Production" />
          </div>
          <div class="pf-v6-c-form__group">
            <label class="pf-v6-c-form__label" for="asset-type-input">Asset type</label>
            <select class="pf-v6-c-form-control" id="asset-type-input">
              <option>OpenAI-compatible endpoint</option>
            </select>
          </div>
          <div class="pf-v6-c-form__group">
            <label class="pf-v6-c-check">
              <input class="pf-v6-c-check__input" type="checkbox" id="asr-capable-input" checked />
              <span class="pf-v6-c-check__label">Audio/ASR capable</span>
            </label>
          </div>
        </div>
      </div>
      <footer class="pf-v6-c-modal-box__footer">
        <button class="pf-v6-c-button pf-m-primary" type="button" data-ouia-component-id="save-ai-asset">Save</button>
        <button class="pf-v6-c-button pf-m-link" type="button" data-ouia-component-id="cancel-ai-asset">Cancel</button>
      </footer>
    </dialog>
    <script src="../assets/app.js"></script>

</body>
</html>
