<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground — Multimodal Support</title>
    <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@6/patternfly.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@6/patternfly-addons.min.css" />
    <link rel="stylesheet" href="../assets/app.css" />
  </head>
  <body class="pf-m-redhat-font" data-page="playground">
    <div class="pf-v6-c-page uxd-page">
      <header class="pf-v6-c-masthead" id="masthead">
        <div class="pf-v6-c-masthead__main">
          <a class="pf-v6-c-brand uxd-brand" href="../">Gen AI Studio</a>
        </div>
        <nav class="pf-v6-c-nav uxd-top-nav" aria-label="Primary">
          <a class="pf-v6-c-nav__link pf-m-current" href="./" data-ouia-component-id="nav-playground">Playground</a>
          <a class="pf-v6-c-nav__link" href="../ai-assets/" data-ouia-component-id="nav-ai-assets">AI Asset Endpoints</a>
        </nav>
      </header>
      <main class="pf-v6-c-page__main">
        <section class="pf-v6-c-page__main-section pf-m-light uxd-page-header">
          <div>
            <h1>Playground</h1>
            <p>Model controls change with capability tags from the model catalog.</p>
          </div>
          <span class="pf-v6-c-label pf-m-blue" id="scenario-label">Scenario: default</span>
        </section>
        <section class="pf-v6-c-page__main-section">
          <div class="pf-v6-l-grid pf-m-gutter uxd-playground-grid">
            <div class="pf-v6-l-grid__item pf-m-4-col-on-xl">
              <article class="pf-v6-c-card pf-m-rounded">
                <div class="pf-v6-c-card__title">Configuration</div>
                <div class="pf-v6-c-card__body uxd-config">
                  <label class="pf-v6-c-form__label" for="model-select">Primary model</label>
                  <select class="pf-v6-c-form-control" id="model-select" data-ouia-component-id="model-select"></select>
                  <div class="pf-v6-c-form__group">
                    <label class="pf-v6-c-form__label" for="asr-model-select">ASR model</label>
                    <select class="pf-v6-c-form-control" id="asr-model-select" data-ouia-component-id="asr-model-select"></select>
                  </div>
                  <div id="capability-badges" class="uxd-badges"></div>
                </div>
              </article>
            </div>
            <div class="pf-v6-l-grid__item pf-m-8-col-on-xl">
              <article class="pf-v6-c-card pf-m-rounded uxd-chat-card">
                <div class="pf-v6-c-card__title">Conversation</div>
                <div class="pf-v6-c-card__body uxd-alert-slot" id="alert-slot"></div>
                <div class="pf-v6-c-card__body uxd-transcript" id="transcript" aria-live="polite"></div>
                <div class="pf-v6-c-card__footer">
                  <div class="uxd-input-controls" id="input-controls"></div>
                  <div class="uxd-composer">
                    <label class="pf-v6-c-form__label" for="prompt-input">Text prompt</label>
                    <textarea class="pf-v6-c-form-control" id="prompt-input" rows="2" aria-label="Text prompt"></textarea>
                    <button class="pf-v6-c-button pf-m-primary" type="button" data-ouia-component-id="submit-prompt">Send</button>
                  </div>
                </div>
              </article>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="../assets/app.js"></script>

</body>
</html>
