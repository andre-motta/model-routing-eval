<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playground · Gen AI studio · RHAISTRAT-1527 prototype</title>
  <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@6/patternfly.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@6/patternfly-addons.min.css" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
<div class="pf-v6-c-page">
  <header class="pf-v6-c-masthead">
    <div class="pf-v6-c-masthead__main">
      <div class="pf-v6-c-masthead__brand">
        <a class="mm-brand" href="playground.html">Red Hat OpenShift AI<small>Prototype · RHAISTRAT-1527</small></a>
      </div>
    </div>
    <div class="pf-v6-c-masthead__content"></div>
  </header>

  <div class="pf-v6-c-page__sidebar">
    <div class="pf-v6-c-page__sidebar-body">
      <nav class="pf-v6-c-nav" aria-label="Global">
        <ul class="pf-v6-c-nav__list" role="list">
          <li class="pf-v6-c-nav__item pf-m-expandable pf-m-expanded">
            <button class="pf-v6-c-nav__link" type="button" aria-expanded="true">
              <span class="pf-v6-c-nav__link-text">Gen AI studio</span>
            </button>
            <section class="pf-v6-c-nav__subnav" aria-label="Gen AI studio">
              <ul class="pf-v6-c-nav__list" role="list">
                <li class="pf-v6-c-nav__item"><a href="ai-asset-endpoints.html" class="pf-v6-c-nav__link" data-ouia-component-id="nav-ai-asset-endpoints"><span class="pf-v6-c-nav__link-text">AI asset endpoints</span></a></li>
                <li class="pf-v6-c-nav__item"><a href="playground.html" class="pf-v6-c-nav__link pf-m-current" aria-current="page" data-ouia-component-id="nav-playground"><span class="pf-v6-c-nav__link-text">Playground</span></a></li>
              </ul>
            </section>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <div class="pf-v6-c-page__main-container">
    <main class="pf-v6-c-page__main" tabindex="-1">
      <section class="pf-v6-c-page__main-section">
        <div class="pf-v6-c-page__main-body">
          <h1 class="pf-v6-c-title pf-m-2xl">Playground</h1>
          <p class="pf-v6-u-color-200 pf-v6-u-mt-xs">Chat with models in the genai-team project. Models labeled Image input or Audio input accept files alongside text.</p>
        </div>
      </section>
      <section class="pf-v6-c-page__main-section pf-m-fill">
        <div class="pf-v6-c-page__main-body">
          <div class="mm-playground">
            <div class="pf-v6-c-card mm-settings">
              <div class="pf-v6-c-card__title"><h2 class="pf-v6-c-card__title-text">Settings</h2></div>
              <div class="pf-v6-c-card__body">
                <form class="pf-v6-c-form" novalidate onsubmit="return false" id="playground-settings" aria-label="Playground settings"></form>
              </div>
            </div>

            <div class="pf-v6-c-card mm-chat">
              <div class="mm-chat__header">
                <h2 class="pf-v6-c-title pf-m-lg">Chat</h2>
                <button class="pf-v6-c-button pf-m-secondary pf-m-small" type="button" id="new-chat-button" data-ouia-component-id="new-chat"><span class="pf-v6-c-button__text">New chat</span></button>
              </div>
              <div class="mm-transcript-area" id="chat-transcript" role="log" aria-label="Chat transcript" aria-live="polite"></div>
              <div class="mm-composer" aria-label="Message composer" role="group">
                <div class="mm-composer__alerts" id="composer-alerts"></div>
                <div class="mm-composer__pending" id="composer-pending"></div>
                <div class="mm-controls" id="modality-controls" role="group" aria-label="Attach files"></div>
                <div class="mm-composer__row">
                  <span class="pf-v6-c-form-control pf-m-textarea pf-m-resize-vertical">
                    <textarea id="chat-input" rows="2" aria-label="Message" placeholder="Send a message…" data-ouia-component-id="chat-input"></textarea>
                  </span>
                  <button class="pf-v6-c-button pf-m-primary" type="button" id="send-button" data-ouia-component-id="send-message"><span class="pf-v6-c-button__text">Send</span></button>
                </div>
                <input type="file" id="image-file-input" accept="image/jpeg,image/png,.jpg,.jpeg,.png" hidden aria-hidden="true" tabindex="-1" />
                <input type="file" id="audio-file-input" accept="audio/wav,audio/x-wav,audio/mpeg,.wav,.mp3" hidden aria-hidden="true" tabindex="-1" />
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="assets/data.js"></script>
<script src="assets/playground.js"></script>
