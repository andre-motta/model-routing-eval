<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gen AI Studio | Playground</title>
  <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@6/patternfly.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@6/patternfly-addons.min.css" />
  <style>
    :root{--pf-t--global--color--brand--default:#0066cc;--ink:#151515;--muted:#6a6e73;--line:#d2d2d2;--page:#f5f5f5;--success:#3e8635;--danger:#c9190b;--amber:#f0ab00}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:var(--pf-t--global--font--family--sans-serif,Arial,sans-serif)}
    .masthead{height:64px;background:#151515;color:white;display:flex;align-items:center;padding:0 28px;gap:16px;box-shadow:0 2px 4px #0003}.brand{font-size:20px;font-weight:700}.brand span{font-weight:400;color:#d2d2d2}.masthead-right{margin-left:auto;font-size:13px;color:#d2d2d2}
    .layout{display:flex;min-height:calc(100vh - 64px)}.sidebar{width:240px;background:white;border-right:1px solid var(--line);padding:18px 0}.nav-heading{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em;padding:8px 22px}.nav-link{display:flex;gap:12px;align-items:center;padding:12px 22px;color:#151515;text-decoration:none;font-size:14px;border-left:3px solid transparent}.nav-link:hover{background:#f0f0f0}.nav-link.active{background:#e7f1fa;border-left-color:#0066cc;font-weight:600}.nav-icon{width:18px;text-align:center;color:#4f5255}.main{padding:28px 34px 56px;max-width:1200px;width:100%;margin:0 auto}.breadcrumbs{font-size:13px;color:var(--muted);margin:0 0 14px}.breadcrumbs a{color:#0066cc}.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.title-row h1{font-size:27px;margin:0 0 6px;font-weight:500}.subtitle{font-size:14px;color:var(--muted)}.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600;background:#e7f1fa;color:#004b95}.badge.green{background:#e7f4e4;color:#1e4f18}.badge.gray{background:#f0f0f0;color:#3c3f42}.badge.amber{background:#fff4cc;color:#795600}.card{background:white;border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 2px #00000012;margin-bottom:18px}.card-head{padding:16px 20px;border-bottom:1px solid #e6e6e6;display:flex;align-items:center;justify-content:space-between}.card-head h2{font-size:16px;margin:0;font-weight:600}.card-body{padding:18px 20px}.toolbar{display:flex;gap:10px;align-items:center}.btn{border:1px solid #8a8d90;background:white;color:#151515;border-radius:3px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer}.btn:hover{background:#f0f0f0}.btn.primary{background:#0066cc;border-color:#0066cc;color:white}.btn.primary:hover{background:#004d99}.btn:disabled{opacity:.45;cursor:not-allowed}.select,input,textarea{font:inherit;border:1px solid #8a8d90;border-radius:3px;background:white;padding:9px 10px;color:#151515}.select{min-width:220px}label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}.help{font-size:12px;color:var(--muted);margin-top:5px}.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid #73bcf7;border-left:4px solid #0066cc;border-radius:3px;background:#e7f1fa;margin-bottom:16px;font-size:14px}.alert.warning{border-color:#f0ab00;background:#fff4cc}.alert.danger{border-color:#c9190b;background:#faeae8}.alert.success{border-color:#3e8635;background:#e7f4e4}.alert strong{display:block;margin-bottom:3px}.alert .close{margin-left:auto;border:0;background:transparent;font-size:18px;cursor:pointer}.tabs{display:flex;border-bottom:1px solid var(--line);gap:0}.tab{padding:12px 18px;border-bottom:3px solid transparent;color:#4f5255;cursor:pointer;font-size:14px}.tab.active{border-color:#0066cc;color:#0066cc;font-weight:600}.composer{border:1px solid #8a8d90;border-radius:4px;padding:14px;background:white}.composer textarea{border:0;resize:vertical;width:100%;min-height:74px;padding:4px;outline:none}.composer-actions{display:flex;align-items:center;gap:10px;border-top:1px solid #eee;padding-top:12px;margin-top:8px}.spacer{flex:1}.file-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid #d2d2d2;background:#f5f5f5;padding:7px 10px;border-radius:3px;font-size:13px;margin:4px 0 10px}.transcript{display:flex;flex-direction:column;gap:14px}.message{padding:14px 16px;border-radius:4px;max-width:88%;font-size:14px;line-height:1.55}.message.user{align-self:flex-end;background:#e7f1fa;border:1px solid #bee1f4}.message.assistant{align-self:flex-start;background:#fff;border:1px solid var(--line)}.message-meta{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}.image-preview{height:135px;width:180px;border-radius:4px;background:linear-gradient(145deg,#dbe8ed,#f4d9ac 52%,#689780);display:flex;align-items:end;padding:9px;color:#fff;font-size:11px;text-shadow:0 1px 2px #222}.dropzone{border:2px dashed #8a8d90;background:#fafafa;padding:20px;text-align:center;border-radius:4px;color:#4f5255}.dropzone b{display:block;color:#151515;margin-bottom:5px}.dropzone input{display:none}.model-grid{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.status-dot{width:8px;height:8px;background:#3e8635;border-radius:100%;display:inline-block;margin-right:6px}.table{width:100%;border-collapse:collapse;font-size:14px}.table th{text-align:left;background:#f5f5f5;border-bottom:1px solid #d2d2d2;padding:12px;font-size:12px;color:#4f5255}.table td{padding:14px 12px;border-bottom:1px solid #e6e6e6}.table tr:last-child td{border-bottom:0}.asset-name{font-weight:600;color:#0066cc}.empty-state{text-align:center;padding:42px 20px}.empty-icon{font-size:32px;color:#6a6e73;margin-bottom:12px}.empty-state h3{margin:0 0 8px;font-size:18px}.empty-state p{color:var(--muted);max-width:490px;margin:0 auto 18px;line-height:1.5}.modal-backdrop{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:50}.modal{width:min(560px,92vw);background:white;border-radius:5px;box-shadow:0 8px 30px #0004}.modal-head,.modal-foot{padding:16px 20px;border-bottom:1px solid #e6e6e6;display:flex;align-items:center;justify-content:space-between}.modal-foot{border:0;border-top:1px solid #e6e6e6;justify-content:flex-end;gap:10px}.modal-body{padding:20px}.modal-head h2{font-size:18px;margin:0}.form-row{margin-bottom:18px}.check-row{display:flex;align-items:center;gap:9px}.check-row input{width:16px;height:16px}.check-row label{margin:0}.footer-note{color:var(--muted);font-size:12px;margin-top:12px}.toast{position:fixed;right:25px;bottom:24px;z-index:20}.hidden{display:none!important}
    @media(max-width:800px){.sidebar{width:64px}.nav-heading,.nav-link .nav-text{display:none}.nav-link{justify-content:center;padding:14px}.main{padding:22px 16px}.title-row{display:block}.title-row>.badge{margin-top:12px}.message{max-width:100%}}
  </style>
</head>
<body>
  <header class="masthead"><div class="brand">Red Hat <span>OpenShift AI</span></div><div class="masthead-right">Gen AI Studio &nbsp;⌄</div></header>
  <div class="layout">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="nav-heading">Gen AI Studio</div>
      <a class="nav-link" id="nav-playground" href="?page=playground&scenario=default"><span class="nav-icon">✦</span><span class="nav-text">Playground</span></a>
      <a class="nav-link" id="nav-assets" href="?page=assets&scenario=default"><span class="nav-icon">▤</span><span class="nav-text">AI Asset Endpoints</span></a>
      <div class="nav-heading" style="margin-top:20px">Resources</div>
      <a class="nav-link" href="#" onclick="return false"><span class="nav-icon">◈</span><span class="nav-text">Models</span></a>
    </aside>
    <main class="main" id="app" aria-live="polite"></main>
  </div>
  <script>
    (function(){
      const params=new URLSearchParams(location.search);const route=(location.pathname.endsWith('/ai-assets')||params.get('page')==='assets')?'/ai-assets':'/playground';const requested=params.get('scenario')||'default';
      const scenarios={
        '/playground':['default','audio-ready','no-asr-assets','unsupported-model','upload-too-large','inference-error','file-limit-reached'],
        '/ai-assets':['default','no-assets','unmarked-assets','asset-load-error']
      };
      const scenario=scenarios[route].includes(requested)?requested:'default';
      const app=document.getElementById('app');document.getElementById(route==='/playground'?'nav-playground':'nav-assets').classList.add('active');
      const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const icon=(s)=>`<span aria-hidden="true">${s}</span>`;
      function scenarioBanner(){if(requested!==scenario)return `<div class="alert warning" role="status"><div>${icon('!')}</div><div><strong>Scenario not available on this page</strong>Showing the default state for ${esc(route)}.</div></div>`;return ''}
      function renderPlayground(){
        const audio=scenario==='audio-ready'||scenario==='no-asr-assets';const unsupported=scenario==='unsupported-model';const tooLarge=scenario==='upload-too-large';const failed=scenario==='inference-error';const limited=scenario==='file-limit-reached';
        let alert='';
        if(unsupported)alert='<div class="alert warning" role="status"><div>!</div><div><strong>Image input is unavailable for this model</strong>Select a model with the <code>image-inferencing</code> capability to attach an image. Text prompting remains available.</div></div>';
        if(scenario==='no-asr-assets')alert='<div class="alert warning" role="status"><div>!</div><div><strong>No transcription models are registered</strong>Register an AI Asset and mark it as an <b>ASR transcription endpoint</b> to enable audio input. <a href="?page=assets">Open AI Asset Endpoints</a></div></div>';
        if(tooLarge)alert='<div class="alert danger" role="alert"><div>!</div><div><strong>Image is larger than 10 MB</strong>Choose a smaller JPG or PNG. The proposed limit is 10 MB and requires product confirmation.</div></div>';
        if(failed)alert='<div class="alert danger" role="alert"><div>×</div><div><strong>Model could not process this image</strong>The selected model rejected a multimodal request. Choose a vision-enabled model tagged <code>image-inferencing</code>, then try again.</div></div>';
        if(limited)alert='<div class="alert warning" role="status"><div>!</div><div><strong>One file per conversation</strong>This conversation already contains an image. Start a new conversation to attach another image or an audio file.</div></div>';
        const imageMode=!audio&&!unsupported;const transcript=failed||limited;
        app.innerHTML=`${scenarioBanner()}<div class="breadcrumbs"><a href="#">Gen AI Studio</a> &nbsp;/&nbsp; Playground</div>
          <div class="title-row"><div><h1>Playground</h1><div class="subtitle">Explore model behavior with prompts and supported input types.</div></div><span class="badge green"><span class="status-dot"></span>Connected</span></div>
          ${alert}
          <section class="card"><div class="card-head"><h2>Model configuration</h2><span class="badge gray">Responses API</span></div><div class="card-body"><div class="model-grid"><div><label for="model">Model</label><select class="select" id="model" aria-label="Model" onchange="modelChanged(this.value)"><option ${unsupported?'':'selected'} value="vision">Qwen2.5-VL · Vision enabled</option><option ${unsupported?'selected':''} value="text">Granite-3.3-8B · Text only</option></select></div><div><label>Capabilities</label><div style="padding:10px 0"><span class="badge ${unsupported?'gray':'green'}">${unsupported?'text':'image-inferencing'}</span> &nbsp;<span class="badge ${audio?'green':'gray'}">${audio?'audio-asr':'audio unavailable'}</span></div></div></div></div></section>
          <section class="card"><div class="card-head"><div class="tabs"><div class="tab ${imageMode?'active':''}" role="tab" aria-selected="${imageMode}" onclick="switchMode('image')">Text + image</div><div class="tab ${audio?'active':''}" role="tab" aria-selected="${audio}" onclick="switchMode('audio')">Audio transcription</div></div><span class="help">One image or audio file per conversation</span></div>
            <div class="card-body"><div class="transcript" id="transcript">${transcript?`<div class="message user"><div class="message-meta">You · 10:42 AM</div><div>What is in this image?</div><div class="file-chip">▧ &nbsp; storefront.png <span class="badge gray">Image</span></div></div>${failed?'<div class="message assistant"><div class="message-meta">Model error</div>I could not process this image with the current model. Check that the selected model supports image input.</div>':''}`:'<div class="message assistant"><div class="message-meta">Gen AI Studio</div>Choose a model, enter a prompt, and attach an image or audio file to get started.</div>'}</div>
              <div style="height:15px"></div>${audio?`<div class="form-row"><label for="asr-model">Transcription model</label><select id="asr-model" class="select" ${scenario==='no-asr-assets'?'disabled':''}><option>${scenario==='no-asr-assets'?'No ASR assets available':'Whisper Large v3 · Local AI Asset'}</option></select><div class="help">Transcription runs through the selected ASR AI Asset before the prompt is sent to your model.</div></div>`:''}
              <div class="composer"><textarea data-ouia-component-id="prompt-input" id="prompt-input" placeholder="${audio?'Add context for the transcript…':'Ask a question about your image…'}" aria-label="Prompt">${audio?'Summarize the main points in this recording.':imageMode?'What is happening in this picture?':''}</textarea>
                ${tooLarge?'<div class="file-chip" style="border-color:#c9190b;color:#a30000">▧ &nbsp; campaign-photo.png · 12.4 MB</div>':''}${limited?'<div class="file-chip">▧ &nbsp; storefront.png · 2.1 MB <span class="badge gray">Image</span></div>':''}
                <div class="composer-actions"><button class="btn" data-ouia-component-id="attach-image" onclick="document.getElementById('image-file').click()" ${unsupported||limited||audio?'disabled':''}>＋ Add image</button><button class="btn" data-ouia-component-id="audio-input" onclick="document.getElementById('audio-file').click()" ${limited?'disabled':''}>♫ Add audio</button><input id="image-file" type="file" accept="image/png,image/jpeg" onchange="filePicked(this,'image')"><input id="audio-file" type="file" accept="audio/wav,audio/mpeg" onchange="filePicked(this,'audio')"><span class="help">JPG, PNG · up to 10 MB</span><span class="spacer"></span><button class="btn" onclick="newConversation()">New conversation</button><button class="btn primary" data-ouia-component-id="send-prompt" onclick="sendPrompt()" ${scenario==='no-asr-assets'?'disabled':''}>Send prompt ↑</button></div>
              </div><div class="footer-note">Files are temporarily handled by Gen AI Studio. Multimodal chat persistence is not available in this prototype.</div></div></section>
          <div class="footer-note">Audio accepts WAV and MP3 only. Microphone capture, PDF as image input, multiple files, streaming, and generated audio are outside this feature scope.</div>`;
      }
      function renderAssets(){const empty=scenario==='no-assets';const unmarked=scenario==='unmarked-assets';const loaderr=scenario==='asset-load-error';app.innerHTML=`${scenarioBanner()}<div class="breadcrumbs"><a href="#">Gen AI Studio</a> &nbsp;/&nbsp; AI Asset Endpoints</div><div class="title-row"><div><h1>AI Asset Endpoints</h1><div class="subtitle">Manage model endpoints available to Gen AI Studio.</div></div><button class="btn primary" onclick="openModal()">＋ Add endpoint</button></div>
        ${loaderr?'<div class="alert danger" role="alert"><div>×</div><div><strong>Could not load AI Asset Endpoints</strong>Check your connection and try again. <button class="btn" onclick="location.reload()">Retry</button></div></div>':''}
        ${unmarked?'<div class="alert warning" role="status"><div>!</div><div><strong>No ASR transcription endpoints are configured</strong>Mark a transcription capable asset so it appears in the Playground audio model selector.</div></div>':''}
        <section class="card"><div class="card-head"><h2>Endpoints</h2><div class="toolbar"><input placeholder="Search endpoints" aria-label="Search endpoints"><button class="btn">Filter</button></div></div><div class="card-body" style="padding:0">${empty?'<div class="empty-state"><div class="empty-icon">▤</div><h3>No AI Asset Endpoints</h3><p>Register an endpoint to make it available in Gen AI Studio. Mark a transcription model as ASR capable to enable audio input in the Playground.</p><button class="btn primary" onclick="openModal()">Add endpoint</button></div>':`<table class="table"><thead><tr><th>Name</th><th>Endpoint type</th><th>Capabilities</th><th>Status</th><th></th></tr></thead><tbody><tr><td><a class="asset-name" href="#">Whisper Large v3</a><div class="help">whisper-large-v3 · namespace: team-a</div></td><td>InferenceService</td><td>${unmarked?'<span class="badge gray">No capability flags</span>':'<span class="badge green">audio-asr</span>'}</td><td><span class="status-dot"></span>Ready</td><td><button class="btn" data-ouia-component-id="edit-whisper" onclick="openModal()">Edit</button></td></tr><tr><td><a class="asset-name" href="#">Granite 3.3 8B</a><div class="help">granite-3-3-8b · namespace: team-a</div></td><td>InferenceService</td><td><span class="badge gray">text</span></td><td><span class="status-dot"></span>Ready</td><td><button class="btn" onclick="openModal()">Edit</button></td></tr></tbody></table>`}</div></section>
        <div class="footer-note">ASR capability metadata makes registered endpoints available in the Playground transcription model selector.</div>`}
      window.switchMode=function(mode){const url=new URL(location.href);url.searchParams.set('page','playground');url.searchParams.set('scenario',mode==='audio'?'audio-ready':'default');location.href=url};
      window.modelChanged=function(value){if(value==='text'){const url=new URL(location.href);url.searchParams.set('scenario','unsupported-model');location.href=url}};
      window.filePicked=function(input,type){if(!input.files||!input.files.length)return;const file=input.files[0];if(file.size>10*1024*1024){const url=new URL(location.href);url.searchParams.set('scenario','upload-too-large');location.href=url;return}const chip=document.createElement('div');chip.className='file-chip';chip.textContent=(type==='image'?'▧ ':'♫ ')+file.name+' · '+(file.size/1024/1024).toFixed(1)+' MB';document.querySelector('.composer').insertBefore(chip,document.querySelector('.composer-actions'))};
      window.sendPrompt=function(){const alert=document.createElement('div');alert.className='alert success toast';alert.innerHTML='<div>✓</div><div><strong>Prompt submitted</strong>Your request is processing. This standalone demo uses mock responses.</div>';document.body.appendChild(alert);setTimeout(()=>alert.remove(),3000)};
      window.newConversation=function(){const url=new URL(location.href);url.searchParams.set('scenario','default');location.href=url};
      window.openModal=function(){const modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">Edit AI Asset Endpoint</h2><button class="btn" onclick="this.closest(\'.modal-backdrop\').remove()" aria-label="Close">×</button></div><div class="modal-body"><div class="form-row"><label for="asset-name">Endpoint name</label><input id="asset-name" value="Whisper Large v3" style="width:100%"><div class="help">Use a clear name so users can identify this endpoint in the Playground.</div></div><div class="form-row"><label>Capabilities</label><div class="check-row"><input type="checkbox" id="asr-flag" checked><label for="asr-flag">Audio transcription (ASR)</label></div><div class="help">ASR assets appear in the Playground audio model selector.</div></div><div class="form-row"><div class="check-row"><input type="checkbox" id="image-flag"><label for="image-flag">Image input</label></div></div></div><div class="modal-foot"><button class="btn" onclick="this.closest(\'.modal-backdrop\').remove()">Cancel</button><button class="btn primary" data-ouia-component-id="save-asset" onclick="this.closest(\'.modal-backdrop\').remove();const n=document.createElement(\'div\');n.className=\'alert success toast\';n.innerHTML=\'<div>✓</div><div><strong>Endpoint updated</strong>Whisper Large v3 is available for audio transcription.</div>\';document.body.appendChild(n);setTimeout(()=>n.remove(),3000)">Save endpoint</button></div></section>';document.body.appendChild(modal)};
      if(route==='/playground')renderPlayground();else renderAssets();
    })();
  </script>
<script data-uxd-prototype-bar="config">window.__UXD_PROTOTYPE__={"id":"RHAISTRAT-1527","title":"RHAISTRAT-1527","jiraBaseUrl":"https://issues.example.com/browse/","sources":[],"views":{"prototype":null,"eval":"/evals/RHAISTRAT-1527/"},"scenarios":[{"route":"/playground","id":"default","name":"Vision ready","default":true},{"route":"/playground","id":"audio-ready","name":"ASR ready"},{"route":"/playground","id":"no-asr-assets","name":"No ASR model registered"},{"route":"/playground","id":"unsupported-model","name":"Model lacks image capability"},{"route":"/playground","id":"upload-too-large","name":"Upload exceeds limit"},{"route":"/playground","id":"inference-error","name":"Multimodal inference rejected"},{"route":"/playground","id":"file-limit-reached","name":"Conversation already has a file"},{"route":"/ai-assets","id":"default","name":"Assets with ASR model","default":true},{"route":"/ai-assets","id":"no-assets","name":"No AI Assets registered"},{"route":"/ai-assets","id":"unmarked-assets","name":"No ASR capability marked"},{"route":"/ai-assets","id":"asset-load-error","name":"Asset list failed to load"}]};</script>
<link rel="stylesheet" href="uxd-prototype-bar/prototype-bar.css" data-uxd-prototype-bar="install" />
<script src="uxd-prototype-bar/serialize-page.browser.js" data-uxd-prototype-bar="install"></script>
<script src="uxd-prototype-bar/export-pf-spec.browser.js" data-uxd-prototype-bar="install"></script>
<script src="uxd-prototype-bar/uxd-scenario-runtime.js" data-uxd-prototype-bar="install"></script>
<script src="uxd-prototype-bar/prototype-bar-standalone.js" data-uxd-prototype-bar="install"></script>
</body>
</html>
