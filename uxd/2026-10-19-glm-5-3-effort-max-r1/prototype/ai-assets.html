        </div>
        <div class="pf-v6-c-card__body">
          <h2 id="asset-heading" class="pf-v6-c-title pf-m-lg">ASR capability registration</h2>
          <p class="prototype-hint">
            Mark an OpenAI-compatible AI Asset as ASR-capable when it exposes <code>/v1/audio/transcriptions</code>.
            ASR-capable assets appear in the Playground audio model dropdown.
          </p>
        </div>
        <div class="pf-v6-c-card__body">
          <div id="asset-status" role="status" aria-live="polite"></div>
          <div id="asset-table"></div>
          <div class="prototype-action-row">
            <button
              type="button"
              class="pf-v6-c-button pf-m-primary"
              data-ouia-component-id="save-asr-capability"
            >
              Save ASR capability
            </button>
            <a class="pf-v6-c-button pf-m-secondary" href="./">Open Playground</a>
          </div>
        </div>
      </section>
    </main>
