prompt: "Run the uxd-prototype-create skill from the uxd-prototype plugin. In Claude Code it is the slash command `/uxd-prototype:uxd-prototype-create`; in Codex it is the skill staged under `.agents/skills/uxd-prototype-create`. Invoke it with exactly these arguments:\n\n    https://redhat.atlassian.net/browse/RHAISTRAT-1527 --workspace . --target none --decisions skip\n\nThe workspace is this directory: the UXD team's Red Hat OpenShift AI prototype codebase (React, TypeScript, PatternFly 6, webpack; see AGENTS.md and src/app/routes.tsx). Dependencies are already installed in node_modules; do not run npm install. Build the prototype inside this codebase following its conventions, as the skill's workspace mode describes.\n\nThis is a non-interactive run. Treat this message as the user's \"yes\" to the Prototype Plan and to every later confirmation the skill would normally wait for; print the plan and continue without stopping. Jira is not reachable from this environment: the RFE is already\
  \ saved as the local artifact `.artifacts/RHAISTRAT-1527/rfe-snapshot.md`, so use it as the source (the skill's Step 1 local-artifact path).\n\nComplete every step the skill defines for workspace mode: user stories, `journeys.json`, `scenarios.json` (distinct on-load end states per page, selectable with `?scenario=<id>`), the codebase analysis in `workspace-analysis.json`, the prototype in `src/` wired to `?scenario=` through `window.UxdScenario` / `useUxdScenario`, registered routes and navigation, the reachability self-check, `changeset.md`, `metadata.json`, `prototype-summary.yaml`, the Prototype Bar install, and the mandatory post-change verification (type-check and lint must pass, recorded in `verification.json`). Finish with the skill's summary of what was built.\n"
