task: r02_fromager_age_filter
prompt: 'This is the fromager repository (Python wheel builder). A virtualenv with the project

  and test dependencies is already set up at `.venv`; run tests with

  `.venv/bin/python -m pytest -o addopts="" tests/...`.


  Bug report:


  > With `--max-release-age` in multi-version bootstrap mode, a package that is pinned in

  > the constraints file (for example `boto3==1.35.88`) to a version older than the age

  > window has every candidate removed by the age filter and resolution fails silently.

  > In single-version mode the fallback keeps all candidates anyway, but logs a misleading

  > "keeping all to avoid empty resolution" warning for a package the user explicitly

  > pinned.

  >

  > A constraint is explicit user intent. Packages that have a constraint in the provider''s

  > constraints object should skip age filtering entirely in

  > `find_all_matching_from_provider()` (see `src/fromager/resolver.py`), and log at INFO

  > level on the `fromager.resolver` logger:

  > `"<name>: skipping age filter for constrained package (<N> candidate(s))"`.

  > Unconstrained packages keep the current behaviour.


  Fix it, update the docstring, add tests in `tests/test_cooldown.py` for both the

  constrained and the unconstrained case, and run that test file.

  '
